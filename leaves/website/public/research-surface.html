<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fractal Research Surface — Multi-View</title>
<style>
:root {
  --bg:      #f5f3ef;
  --surface: #ffffff;
  --border:  #dcd8d0;
  --text:    #2a2724;
  --muted:   #8a847c;
  --faint:   #f0ede7;
  --panel-w: 280px;
  --header-h: 60px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Georgia', 'Times New Roman', serif;
  display: flex; flex-direction: column;
}

/* HEADER */
#header {
height: var(--header-h);
background: var(--surface);
border-bottom: 1px solid var(--border);
display: flex; align-items: center;
padding: 0 24px; gap: 20px;
flex-shrink: 0; z-index: 20; position: relative;
}
.header-titles { flex: 1; min-width: 0; }
.header-eyebrow { font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.header-title   { font-size: 14px; font-weight: 400; letter-spacing: 0.02em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* TABS */
#tabs { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; }
.tab-btn {
height: 30px; padding: 0 14px;
border: 1px solid var(--border); border-radius: 20px;
background: transparent; color: var(--muted);
font-family: ‘Georgia’, serif; font-size: 9.5px;
font-style: italic; letter-spacing: 0.05em;
cursor: pointer; transition: all 0.13s; white-space: nowrap;
}
.tab-btn:hover { border-color: #b0a898; color: var(--text); }
.tab-btn.active {
background: var(--text); border-color: var(--text);
color: var(--surface); font-style: normal;
}

/* MAIN */
#main { flex: 1; display: flex; overflow: hidden; position: relative; }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; cursor: default; }

/* PANEL */
#panel {
width: var(--panel-w); background: var(--surface);
border-left: 1px solid var(--border);
display: flex; flex-direction: column;
overflow: hidden; flex-shrink: 0;
}
#panel.hidden { display: none; }
#panel-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#panel-type-label { font-size: 7.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
#panel-name       { font-size: 13px; font-weight: 400; color: var(--text); line-height: 1.4; }
#panel-subtitle   { font-size: 10px; color: var(--muted); font-style: italic; margin-top: 4px; line-height: 1.5; }
#panel-body       { flex: 1; overflow-y: auto; padding: 14px 18px; }

.panel-section-label { font-size: 7.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #c0bbb4; margin: 12px 0 6px; }
.panel-section-label:first-child { margin-top: 0; }
.state-row { display: flex; justify-content: space-between; font-size: 10px; padding: 4px 0; border-bottom: 1px solid var(--faint); color: var(--muted); }
.state-row:last-child { border-bottom: none; }
.state-val { color: var(--text); font-style: italic; }
.tag-pill  { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 9px; margin: 2px 2px 2px 0; border: 1px solid; font-style: italic; line-height: 1.4; }
.rel-row   { padding: 6px 0; border-bottom: 1px solid var(--faint); font-size: 10px; line-height: 1.5; }
.rel-row:last-child { border-bottom: none; }
.rel-name  { color: var(--text); font-size: 10px; }
.rel-type  { font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
.rel-synth { font-style: italic; color: var(--muted); font-size: 9px; }

/* LEGEND */
#legend {
position: absolute; bottom: 16px; left: 18px;
background: rgba(245,243,239,0.93); border: 1px solid var(--border);
border-radius: 8px; padding: 11px 15px;
font-size: 10px; line-height: 1.85; color: var(--muted);
pointer-events: none; backdrop-filter: blur(4px); max-width: 210px;
}
.leg-title { font-size: 7px; letter-spacing: 0.16em; text-transform: uppercase; color: #c0bbb4; margin-bottom: 4px; margin-top: 8px; }
.leg-title:first-child { margin-top: 0; }
.leg-row   { display: flex; align-items: center; gap: 8px; margin-bottom: 1px; }
.leg-swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.leg-line   { width: 20px; height: 2px; flex-shrink: 0; }

/* OVERLAYS */
#view-label { position: absolute; top: 12px; left: 18px; font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #c8c4bc; pointer-events: none; }
#hint       { position: absolute; bottom: 16px; right: 16px; font-size: 9px; color: #c0bbb4; font-style: italic; pointer-events: none; }
</style>

</head>
<body>

<div id="header">
  <div class="header-titles">
    <div class="header-eyebrow">LinkedIn Research Surface</div>
    <div class="header-title">Fractal Research Surface — Multi-View System</div>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-view="fractal">Fractal</button>
    <button class="tab-btn" data-view="purveyor">Purveyor</button>
    <button class="tab-btn" data-view="theme">Theme</button>
    <button class="tab-btn" data-view="structural">Structural</button>
    <button class="tab-btn" data-view="provenance">Provenance</button>
  </div>
</div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="view-label"></div>
    <div id="legend"></div>
    <div id="hint">click node to explore · drag to reposition · click background to reset</div>
  </div>
  <div id="panel" class="hidden">
    <div id="panel-header">
      <div id="panel-type-label"></div>
      <div id="panel-name"></div>
      <div id="panel-subtitle"></div>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

<script>
// ============================================================
//  DATASET
// ============================================================
let DATA = { entities: [], relationships: [] };


// ============================================================
//  INDEXES
// ============================================================
const byId = {};
DATA.entities.forEach(e => { byId[e.id] = e; });

const relsByFrom = {}, relsByTo = {};
DATA.relationships.forEach(r => {
  (relsByFrom[r.from] = relsByFrom[r.from]||[]).push(r);
  (relsByTo[r.to]     = relsByTo[r.to]    ||[]).push(r);
});
function relatedTo(id) { return [...(relsByFrom[id]||[]), ...(relsByTo[id]||[])]; }

const LIFECYCLE = ["exploration","density","soil","work","confirmation"];
const THEME_ORDER = ["t_fatigue","t_builders","t_quality","t_strategy","t_synthesis","t_carry"];
const THEME_COLORS = {
  "t_fatigue":"#c97b6a","t_builders":"#c99550","t_quality":"#c4a84a",
  "t_strategy":"#6e9472","t_synthesis":"#4d8e90","t_carry":"#8878a8"
};

// ============================================================
//  CANVAS STATE
// ============================================================
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
const wrap   = document.getElementById("canvas-wrap");
const panel  = document.getElementById("panel");
const legend = document.getElementById("legend");

let W, H;
let currentView = "fractal", selectedId = null;
let nodes = [], edges = [];
let simRunning = false, simSteps = 0, MAX_SIM = 700;
let dragNode = null, dragOffX = 0, dragOffY = 0, hoveredNode = null;
let animFrame = null;

function resize() {
  W = canvas.width  = wrap.offsetWidth;
  H = canvas.height = wrap.offsetHeight;
  buildView(currentView);
}
window.addEventListener("resize", resize);

// ============================================================
//  VIEW DISPATCHER
// ============================================================
const VIEW_META = {
  fractal:    { label:"FRACTAL VIEW — signal to structure",          desc:"signal flow from theme to structure" },
  purveyor:   { label:"PURVEYOR VIEW — conversation map",            desc:"who should talk to whom" },
  theme:      { label:"THEME VIEW — idea clusters",                  desc:"themes by density and lifecycle stage" },
  structural: { label:"STRUCTURAL VIEW — fractal architecture",      desc:"structural gaps and their relationships" },
  provenance: { label:"PROVENANCE VIEW — who carries what",          desc:"purveyors mapped to themes they express" },
};

function buildView(name) {
  currentView = name;
  selectedId  = null;
  closePanel();
  document.getElementById("view-label").textContent = VIEW_META[name].label;
  nodes = []; edges = [];
  if (name === "fractal")    buildFractalView();
  else if (name === "purveyor")   buildPurveyorView();
  else if (name === "theme")      buildThemeView();
  else if (name === "structural") buildStructuralView();
  else if (name === "provenance") buildProvenanceView();
  buildLegend(name);
  if (animFrame) cancelAnimationFrame(animFrame);
  loop();
}

// ============================================================
//  VIEW 1: FRACTAL — themes left, structures right, lifecycle Y bands
// ============================================================
function buildFractalView() {
  const nodeMap = {};
  const themes  = DATA.entities.filter(e => e.type === "theme");
  const structs = DATA.entities.filter(e => e.type === "structural_fractal");
  const bh = H / LIFECYCLE.length;

  function place(ents, xBase, xRange) {
    // Sort by band then maturity
    const sorted = [...ents].sort((a,b) => {
      const li = LIFECYCLE.indexOf(a.state.lifecycle_stage) - LIFECYCLE.indexOf(b.state.lifecycle_stage);
      return li !== 0 ? li : a.state.maturity_within_stage - b.state.maturity_within_stage;
    });
    // Group by band
    const byBand = {};
    sorted.forEach(e => { (byBand[e.state.lifecycle_stage] = byBand[e.state.lifecycle_stage]||[]).push(e); });
    LIFECYCLE.forEach(stage => {
      const group = byBand[stage]||[];
      const bandCY = (LIFECYCLE.indexOf(stage) + 0.5) * bh;
      group.forEach((e, i) => {
        const spreadY = group.length > 1 ? (i/(group.length-1) - 0.5) * bh * 0.55 : 0;
        const xFrac   = group.length > 1 ? i/(group.length-1) : 0.5;
        const n = {
          id:e.id, entity:e,
          x: xBase + xFrac * xRange,
          y: bandCY + spreadY,
          vx:0, vy:0, dragging:false,
          r: 12 + e.state.density * 2.8,
          color: e.visual.hue, label: e.label, type: e.type,
        };
        nodes.push(n); nodeMap[e.id] = n;
      });
    });
  }

  place(themes,  W*0.08,  W*0.25);
  place(structs, W*0.62,  W*0.28);

  const vis = new Set(nodes.map(n=>n.id));
  edges = DATA.relationships
    .filter(r => (r.type==="converges_to"||r.type==="supports") && vis.has(r.from) && vis.has(r.to))
    .map(r => ({ rel:r, a:nodeMap[r.from], b:nodeMap[r.to] }))
    .filter(e=>e.a&&e.b);

  simRunning = false;
}

// ============================================================
//  VIEW 2: PURVEYOR — force-directed, people as primary nodes
// ============================================================
function buildPurveyorView() {
  const cx=W/2, cy=H/2, nodeMap={};
  DATA.entities.filter(e=>e.type==="purveyor").forEach((e,i) => {
    const ti = THEME_ORDER.indexOf((e.themes||[])[0]);
    const angle = (ti/THEME_ORDER.length)*Math.PI*2 + i*0.38;
    const ring  = Math.min(W,H)*0.26;
    const n = { id:e.id, entity:e,
      x: cx+Math.cos(angle)*ring*(0.45+Math.random()*0.65),
      y: cy+Math.sin(angle)*ring*(0.45+Math.random()*0.65),
      vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4,
      dragging:false, r:13+e.state.density*3.0,
      color:e.visual.hue, label:e.label, type:e.type };
    nodes.push(n); nodeMap[e.id]=n;
  });
  const vis = new Set(nodes.map(n=>n.id));
  edges = DATA.relationships
    .filter(r=>(r.type==="should_talk_to"||r.type==="tension_with")&&vis.has(r.from)&&vis.has(r.to))
    .map(r=>({rel:r,a:nodeMap[r.from],b:nodeMap[r.to]})).filter(e=>e.a&&e.b);
  simRunning=true; simSteps=0; MAX_SIM=700;
}

// ============================================================
//  VIEW 3: THEME — theme nodes only, arranged in radial clusters
//  Each theme node in center, purveyors who express it orbiting
// ============================================================
function buildThemeView() {
  const cx=W/2, cy=H/2, nodeMap={};
  const themes = DATA.entities.filter(e=>e.type==="theme");
  const n_t = themes.length;

  themes.forEach((t,ti) => {
    const angle = (ti/n_t)*Math.PI*2 - Math.PI/2;
    const r_ring = Math.min(W,H)*0.30;
    const tx = cx + Math.cos(angle)*r_ring;
    const ty = cy + Math.sin(angle)*r_ring;

    const tn = { id:t.id, entity:t,
      x:tx, y:ty, vx:0,vy:0, dragging:false,
      r:14+t.state.density*3.2,
      color:t.visual.hue, label:t.label, type:"theme" };
    nodes.push(tn); nodeMap[t.id]=tn;

    // Purveyors expressing this theme — small satellites
    const expressers = DATA.relationships
      .filter(r=>r.type==="expresses"&&r.to===t.id)
      .map(r=>byId[r.from]).filter(Boolean);

    expressers.forEach((p,pi) => {
      if(nodeMap[p.id]) return; // already placed (dual-theme purveyors)
      const satAngle = angle + (pi/Math.max(expressers.length,1)-0.5)*1.1 + Math.PI/2;
      const satR     = 80 + pi*10;
      const n = { id:p.id, entity:p,
        x: tx+Math.cos(satAngle)*satR,
        y: ty+Math.sin(satAngle)*satR,
        vx:0,vy:0, dragging:false,
        r: 8+p.state.density*1.6,
        color:t.visual.hue, label:p.label, type:"purveyor",
        satellite:true };
      nodes.push(n); nodeMap[p.id]=n;
    });
  });

  // Edges: expresses (purveyor → theme) + converges_to (theme → structural, excluded here for clarity)
  const vis = new Set(nodes.map(n=>n.id));
  edges = DATA.relationships
    .filter(r=>r.type==="expresses"&&vis.has(r.from)&&vis.has(r.to))
    .map(r=>({rel:r,a:nodeMap[r.from],b:nodeMap[r.to]})).filter(e=>e.a&&e.b);

  simRunning=false;
}

// ============================================================
//  VIEW 4: STRUCTURAL — structural fractals as primary nodes
//  Positioned by lifecycle (Y) and density (X)
//  Themes that converge to them shown as incoming edges
// ============================================================
function buildStructuralView() {
  const nodeMap={};
  const structs = DATA.entities.filter(e=>e.type==="structural_fractal");
  const bh = H / LIFECYCLE.length;
  const margin = W*0.14;

  structs.forEach((e,i) => {
    const li  = LIFECYCLE.indexOf(e.state.lifecycle_stage);
    const bcy = (li+0.5)*bh;
    // Spread by density on X
    const xFrac = (e.state.density-4)/(9-4);
    const n = { id:e.id, entity:e,
      x: margin + xFrac*(W-margin*2) + (Math.random()-0.5)*30,
      y: bcy + (Math.random()-0.5)*bh*0.45,
      vx:0,vy:0, dragging:false,
      r: 14+e.state.density*3.0,
      color:"#8a9aaa", label:e.label, type:"structural_fractal" };
    nodes.push(n); nodeMap[e.id]=n;
  });

  // Also add theme nodes as smaller, dimmer satellites
  DATA.entities.filter(e=>e.type==="theme").forEach((e,i) => {
    const angle = (i/6)*Math.PI*2;
    const n = { id:e.id, entity:e,
      x: W*0.5+Math.cos(angle)*W*0.38 + (Math.random()-0.5)*20,
      y: H*0.5+Math.sin(angle)*H*0.35 + (Math.random()-0.5)*20,
      vx:0,vy:0, dragging:false,
      r: 9+e.state.density*1.5,
      color:e.visual.hue, label:e.label, type:"theme", satellite:true };
    nodes.push(n); nodeMap[e.id]=n;
  });

  const vis = new Set(nodes.map(n=>n.id));
  edges = DATA.relationships
    .filter(r=>(r.type==="converges_to"||r.type==="supports")&&vis.has(r.from)&&vis.has(r.to))
    .map(r=>({rel:r,a:nodeMap[r.from],b:nodeMap[r.to]})).filter(e=>e.a&&e.b);

  simRunning=false;
}

// ============================================================
//  VIEW 5: PROVENANCE — bipartite: purveyors left, themes/structures right
//  Shows the full express + structural chain per person
// ============================================================
function buildProvenanceView() {
  const nodeMap={};
  const purveyors = DATA.entities.filter(e=>e.type==="purveyor")
    .sort((a,b)=>b.state.density-a.state.density);
  const themes    = DATA.entities.filter(e=>e.type==="theme");
  const structs   = DATA.entities.filter(e=>e.type==="structural_fractal");

  const leftX  = W*0.18;
  const midX   = W*0.52;
  const rightX = W*0.82;
  const marginY = 40;

  // Purveyors — left column
  purveyors.forEach((e,i) => {
    const y = marginY + (i/(purveyors.length-1))*(H-marginY*2);
    const n = { id:e.id, entity:e,
      x:leftX, y, vx:0,vy:0, dragging:false,
      r:10+e.state.density*2.0,
      color:e.visual.hue, label:e.label, type:"purveyor" };
    nodes.push(n); nodeMap[e.id]=n;
  });

  // Themes — middle column, sorted by lifecycle
  const themesSorted = [...themes].sort((a,b)=>LIFECYCLE.indexOf(a.state.lifecycle_stage)-LIFECYCLE.indexOf(b.state.lifecycle_stage));
  themesSorted.forEach((e,i) => {
    const y = marginY + (i/(themesSorted.length-1||1))*(H-marginY*2);
    const n = { id:e.id, entity:e,
      x:midX, y, vx:0,vy:0, dragging:false,
      r:11+e.state.density*2.2,
      color:e.visual.hue, label:e.label, type:"theme" };
    nodes.push(n); nodeMap[e.id]=n;
  });

  // Structures — right column
  const structsSorted = [...structs].sort((a,b)=>LIFECYCLE.indexOf(a.state.lifecycle_stage)-LIFECYCLE.indexOf(b.state.lifecycle_stage));
  structsSorted.forEach((e,i) => {
    const y = marginY + (i/(structsSorted.length-1||1))*(H-marginY*2);
    const n = { id:e.id, entity:e,
      x:rightX, y, vx:0,vy:0, dragging:false,
      r:10+e.state.density*2.0,
      color:"#8a9aaa", label:e.label, type:"structural_fractal" };
    nodes.push(n); nodeMap[e.id]=n;
  });

  const vis = new Set(nodes.map(n=>n.id));
  edges = DATA.relationships
    .filter(r=>(r.type==="expresses"||r.type==="converges_to")&&vis.has(r.from)&&vis.has(r.to))
    .map(r=>({rel:r,a:nodeMap[r.from],b:nodeMap[r.to]})).filter(e=>e.a&&e.b);

  simRunning=false;
}

// ============================================================
//  SIMULATION (force-directed for purveyor view only)
// ============================================================
function simulate() {
  if(!simRunning) return;
  const cx=W/2,cy=H/2;
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||0.1;
      const min=a.r+b.r+44;
      if(d<min){const f=(min-d)/d*0.36;
        if(!a.dragging){a.vx-=dx*f*0.5;a.vy-=dy*f*0.5;}
        if(!b.dragging){b.vx+=dx*f*0.5;b.vy+=dy*f*0.5;}}
    }
  }
  edges.forEach(e=>{
    const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.sqrt(dx*dx+dy*dy)||0.1;
    const f=(d-190)/d*0.028;
    if(!e.a.dragging){e.a.vx+=dx*f;e.a.vy+=dy*f;}
    if(!e.b.dragging){e.b.vx-=dx*f;e.b.vy-=dy*f;}
  });
  nodes.forEach(n=>{
    if(n.dragging)return;
    n.vx+=(cx-n.x)*0.0022;n.vy+=(cy-n.y)*0.0022;
    n.vx*=0.80;n.vy*=0.80;n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(n.r+6,Math.min(W-n.r-6,n.x));
    n.y=Math.max(n.r+6,Math.min(H-n.r-6,n.y));
  });
  simSteps++;
  if(simSteps>MAX_SIM) simRunning=false;
}

// ============================================================
//  DRAWING
// ============================================================
function h2r(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawLifecycleBands() {
  const bh=H/LIFECYCLE.length;
  const labels=["Exploration","Density","Soil","Work","Confirmation"];
  labels.forEach((l,i)=>{
    ctx.fillStyle=i%2===0?"rgba(0,0,0,0.018)":"rgba(0,0,0,0.008)";
    ctx.fillRect(0,i*bh,W,bh);
    if(i>0){ctx.strokeStyle="#dcd8d0";ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(0,i*bh);ctx.lineTo(W,i*bh);ctx.stroke();}
    ctx.font="8px Georgia,serif";ctx.fillStyle="#c8c4bc";
    ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText(l.toUpperCase(),12,i*bh+bh/2);
  });
}

function drawBipartiteGuides() {
  // Column headers for provenance view
  ctx.font="8px Georgia,serif"; ctx.fillStyle="#c8c4bc"; ctx.textAlign="center";
  ctx.fillText("PURVEYORS",  W*0.18, 18);
  ctx.fillText("THEMES",     W*0.52, 18);
  ctx.fillText("STRUCTURAL", W*0.82, 18);
  // Faint vertical guides
  [W*0.18,W*0.52,W*0.82].forEach(x=>{
    ctx.strokeStyle="#e8e4de";ctx.lineWidth=0.5;
    ctx.setLineDash([3,6]);
    ctx.beginPath();ctx.moveTo(x,26);ctx.lineTo(x,H-10);ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawEdge(e) {
  const sel = selectedId;
  const focused = sel && (e.a.id===sel||e.b.id===sel);
  const dimmed  = sel && !focused;
  const type    = e.rel.type;

  // Satellite edges are always lighter
  const isSat = e.a.satellite || e.b.satellite;

  const alpha = dimmed ? 0.05 : isSat ? (focused?0.55:0.15) : (focused?0.88:(type==="tension_with"?0.30:0.28));
  const weight= type==="tension_with"?1.8:type==="expresses"?0.9:1.3;

  ctx.save(); ctx.globalAlpha=alpha;
  const mx=(e.a.x+e.b.x)/2,my=(e.a.y+e.b.y)/2;
  const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,len=Math.sqrt(dx*dx+dy*dy)||1;
  const pull=currentView==="fractal"||currentView==="structural"||currentView==="provenance"?14:22;
  const cpx=mx-dy/len*pull,cpy=my+dx/len*pull;

  ctx.lineWidth=weight; ctx.lineCap="round";
  if(type==="converges_to"){ ctx.strokeStyle=e.a.color; ctx.setLineDash([]); }
  else if(type==="supports"){ ctx.strokeStyle="#9aabb8"; ctx.setLineDash([4,4]); }
  else if(type==="expresses"){ ctx.strokeStyle=e.b.color||e.a.color; ctx.setLineDash([]); }
  else if(type==="should_talk_to"){ ctx.strokeStyle="#8878a8"; ctx.setLineDash([5,5]); }
  else if(type==="tension_with"){ ctx.strokeStyle="#c97b6a"; ctx.setLineDash([2,5]); ctx.lineWidth=weight+0.4; }

  ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.quadraticCurveTo(cpx,cpy,e.b.x,e.b.y); ctx.stroke();
  ctx.setLineDash([]);

  if(e.rel.synthesis&&(!sel||focused)&&!isSat){
    const lx=(e.a.x+e.b.x)/2+(cpx-mx)*0.5;
    const ly=(e.a.y+e.b.y)/2+(cpy-my)*0.5;
    ctx.globalAlpha=focused?0.70:0.20;
    ctx.font="italic 8px Georgia,serif"; ctx.fillStyle="#8a847c";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(e.rel.synthesis,lx,ly);
  }
  ctx.restore();
}

function drawNode(n) {
  const hov=n===hoveredNode, sel=n.id===selectedId;
  const dimmed=selectedId&&!sel&&n!==hoveredNode;
  const isSat=n.satellite;
  const alpha=dimmed?(isSat?0.15:0.24):1.0;

  ctx.save(); ctx.globalAlpha=alpha;

  if(hov||sel||(n.entity.state.density>=8&&!isSat)){
    const g=ctx.createRadialGradient(n.x,n.y,n.r*0.4,n.x,n.y,n.r*2.4);
    g.addColorStop(0,h2r(n.color,sel?0.20:hov?0.14:0.06));
    g.addColorStop(1,h2r(n.color,0));
    ctx.beginPath();ctx.arc(n.x,n.y,n.r*2.4,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  }

  const fg=ctx.createRadialGradient(n.x-n.r*0.18,n.y-n.r*0.18,0,n.x,n.y,n.r);
  const fillMult = isSat?0.6:1;
  fg.addColorStop(0,h2r(n.color,(sel?0.36:hov?0.26:0.14)*fillMult));
  fg.addColorStop(1,h2r(n.color,(sel?0.20:hov?0.14:0.08)*fillMult));
  ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=fg;ctx.fill();

  ctx.strokeStyle=h2r(n.color,sel?1.0:hov?0.80:(isSat?0.28:0.42));
  ctx.lineWidth=sel?2.0:hov?1.6:(isSat?0.6:0.9);
  ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.stroke();

  // Label — suppress on very small satellite nodes unless hovered/selected
  if(!isSat||(isSat&&(hov||sel))){
    ctx.globalAlpha=alpha;
    const fs=isSat?Math.max(7,Math.min(9,n.r*0.55)):Math.max(8,Math.min(11,n.r*0.36));
    ctx.font=`${fs}px Georgia,serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=sel?"#2a2724":hov?"#2a2724":"#6a6460";
    const words=n.label.split(" ");
    let lines=[],line="";
    const maxW=n.r*(isSat?1.5:1.75);
    words.forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
    if(line)lines.push(line);
    const lh=fs+2,sy=n.y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l,n.x,sy+i*lh));
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#f5f3ef"; ctx.fillRect(0,0,W,H);
  if(currentView==="fractal"||currentView==="structural") drawLifecycleBands();
  if(currentView==="provenance") drawBipartiteGuides();
  edges.forEach(drawEdge);
  nodes.forEach(drawNode);
  // Direction hint
  if(currentView==="fractal"){
    ctx.save();ctx.globalAlpha=0.11;ctx.font="8.5px Georgia,serif";ctx.fillStyle="#c8c4bc";
    ctx.textAlign="center";ctx.fillText("SIGNAL \u2192 STRUCTURE",W/2,H-7);ctx.restore();
  }
}

function loop() { simulate(); draw(); animFrame=requestAnimationFrame(loop); }

function buildLegend(view) {
  const themeBlock = `
    <div class="leg-title">Theme</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#c97b6a"></div>AI Fatigue</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#c99550"></div>Non-Tech Builders</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#c4a84a"></div>Quality &amp; Output</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#6e9472"></div>Strategy in UX</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#4d8e90"></div>Synthesizing Signals</div>
    <div class="leg-row"><div class="leg-swatch" style="background:#8878a8"></div>Translation Carry</div>`;

  const connBlock = {
    fractal: `<div class="leg-title">Connection</div>
      <div class="leg-row"><div class="leg-line" style="background:#c97b6a"></div>converges to</div>
      <div class="leg-row"><div class="leg-line" style="background:#9aabb8;border-top:none"></div>supports</div>`,
    purveyor:`<div class="leg-title">Connection</div>
      <div class="leg-row"><div class="leg-line" style="background:none;border-top:2px dashed #8878a8;height:1px"></div>should talk to</div>
      <div class="leg-row"><div class="leg-line" style="background:none;border-top:2px dotted #c97b6a;height:1px"></div>tension with</div>`,
    theme:   `<div class="leg-title">Connection</div>
      <div class="leg-row"><div class="leg-line" style="background:#c97b6a"></div>expresses</div>`,
    structural:`<div class="leg-title">Connection</div>
      <div class="leg-row"><div class="leg-line" style="background:#c97b6a"></div>converges to</div>
      <div class="leg-row"><div class="leg-line" style="background:none;border-top:2px dashed #9aabb8;height:1px"></div>supports</div>`,
    provenance:`<div class="leg-title">Connection</div>
      <div class="leg-row"><div class="leg-line" style="background:#4d8e90"></div>expresses</div>
      <div class="leg-row"><div class="leg-line" style="background:#8a9aaa"></div>converges to</div>`,
  };

  const sizeNote = `<div class="leg-title" style="margin-top:8px">Node Size</div>
    <div style="font-size:9px;color:#c0bbb4;font-style:italic">larger = higher density</div>`;

  if(view==="fractal"||view==="structural"){
    legend.innerHTML = themeBlock + connBlock[view] + sizeNote;
  } else if(view==="purveyor"){
    legend.innerHTML = themeBlock + connBlock.purveyor + sizeNote;
  } else if(view==="theme"){
    legend.innerHTML = themeBlock + connBlock.theme +
      `<div class="leg-title" style="margin-top:8px">Layout</div>
       <div style="font-size:9px;color:#c0bbb4;font-style:italic">center = theme · orbit = purveyor</div>`;
  } else if(view==="provenance"){
    legend.innerHTML = themeBlock + connBlock.provenance + sizeNote;
  }
}

// ============================================================
//  DETAIL PANEL
// ============================================================
function openPanel(entityId) {
  selectedId = entityId;
  const e = byId[entityId];
  if(!e) return;

  document.getElementById("panel-type-label").textContent = e.type.replace(/_/g," ").toUpperCase();
  document.getElementById("panel-name").textContent       = e.label;
  document.getElementById("panel-subtitle").textContent   = e.subtitle||"";

  const body = document.getElementById("panel-body");
  let html = "";

  // State block
  html += `<div class="panel-section-label">State</div>`;
  html += `<div class="state-row"><span>Lifecycle</span><span class="state-val">${e.state.lifecycle_stage}</span></div>`;
  html += `<div class="state-row"><span>Maturity</span><span class="state-val">${Math.round(e.state.maturity_within_stage*100)}%</span></div>`;
  html += `<div class="state-row"><span>Density</span><span class="state-val">${e.state.density} / 10</span></div>`;
  html += `<div class="state-row"><span>Resolution</span><span class="state-val">${e.state.resolution_status}</span></div>`;

  if(e.type==="purveyor"){
    if(e.themes&&e.themes.length){
      html += `<div class="panel-section-label">Themes</div>`;
      html += e.themes.map(tid=>{const t=byId[tid];if(!t)return"";return`<span class="tag-pill" style="color:${t.visual.hue};border-color:${t.visual.hue}44">${t.label}</span>`;}).join("");
    }
    if(e.structural&&e.structural.length){
      html += `<div class="panel-section-label">Structural</div>`;
      html += e.structural.map(sid=>{const s=byId[sid];if(!s)return"";return`<span class="tag-pill" style="color:#7a8490;border-color:#7a849044">${s.label}</span>`;}).join("");
    }
  }

  if(e.type==="theme"){
    // Show purveyors who express this theme
    const expressers = DATA.relationships.filter(r=>r.type==="expresses"&&r.to===entityId).map(r=>byId[r.from]).filter(Boolean);
    if(expressers.length){
      html += `<div class="panel-section-label">Expressed by</div>`;
      expressers.forEach(p=>{
        html+=`<div class="rel-row"><div class="rel-name">${p.label}</div><div class="rel-synth">${p.subtitle||""}</div></div>`;
      });
    }
    const convs = DATA.relationships.filter(r=>r.type==="converges_to"&&r.from===entityId).map(r=>byId[r.to]).filter(Boolean);
    if(convs.length){
      html += `<div class="panel-section-label">Converges to</div>`;
      convs.forEach(s=>{html+=`<div class="rel-row"><div class="rel-name">${s.label}</div><div class="rel-synth">${s.subtitle||""}</div></div>`;});
    }
  }

  if(e.type==="structural_fractal"){
    const incoming = DATA.relationships.filter(r=>(r.type==="converges_to"||r.type==="supports")&&r.to===entityId).map(r=>byId[r.from]).filter(Boolean);
    if(incoming.length){
      html += `<div class="panel-section-label">Receives from</div>`;
      incoming.forEach(s=>{html+=`<div class="rel-row"><div class="rel-name">${s.label}</div><div class="rel-synth">${s.subtitle||""}</div></div>`;});
    }
    const outgoing = DATA.relationships.filter(r=>(r.type==="supports")&&r.from===entityId).map(r=>byId[r.to]).filter(Boolean);
    if(outgoing.length){
      html += `<div class="panel-section-label">Supports</div>`;
      outgoing.forEach(s=>{html+=`<div class="rel-row"><div class="rel-name">${s.label}</div></div>`;});
    }
  }

  // All relationships
  const rels = relatedTo(entityId);
  if(rels.length){
    html += `<div class="panel-section-label">All Relationships</div>`;
    rels.slice(0,12).forEach(r=>{
      const oid=r.from===entityId?r.to:r.from;
      const other=byId[oid]; if(!other)return;
      const tc=r.type==="tension_with"?"#c97b6a":r.type==="should_talk_to"?"#8878a8":r.type==="converges_to"?"#6e9472":"#7a8490";
      html+=`<div class="rel-row">
        <div class="rel-name">${other.label}</div>
        <div class="rel-type" style="color:${tc}">${r.type.replace(/_/g," ")}</div>
        ${r.synthesis?`<div class="rel-synth">${r.synthesis}</div>`:""}
      </div>`;
    });
  }

  body.innerHTML = html;
  panel.classList.remove("hidden");
}

function closePanel(){
  panel.classList.add("hidden");
  selectedId=null;
}

// ============================================================
//  INTERACTION
// ============================================================
function nodeAt(x,y){
  for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];const dx=x-n.x,dy=y-n.y;if(dx*dx+dy*dy<=n.r*n.r)return n;}return null;
}
function xy(evt){const rect=canvas.getBoundingClientRect();const s=evt.touches?evt.touches[0]:evt;return[s.clientX-rect.left,s.clientY-rect.top];}

let lastDownNode=null,lastDownPos=[0,0];
canvas.addEventListener("mousemove",evt=>{
  const[x,y]=xy(evt);
  if(dragNode){dragNode.x=x+dragOffX;dragNode.y=y+dragOffY;return;}
  const n=nodeAt(x,y);
  if(n!==hoveredNode){hoveredNode=n;canvas.style.cursor=n?"pointer":"default";}
});
canvas.addEventListener("mousedown",evt=>{
  const[x,y]=xy(evt);const n=nodeAt(x,y);
  if(n){dragNode=n;n.dragging=true;dragOffX=n.x-x;dragOffY=n.y-y;lastDownNode=n;lastDownPos=[x,y];}
  else{lastDownNode=null;}
});
canvas.addEventListener("mouseup",evt=>{
  if(dragNode){
    const[x,y]=xy(evt);
    const dist=Math.sqrt((x-lastDownPos[0])**2+(y-lastDownPos[1])**2);
    dragNode.dragging=false;
    if(dist<5&&lastDownNode) openPanel(lastDownNode.id);
    dragNode=null;
  }
});
canvas.addEventListener("click",evt=>{
  const[x,y]=xy(evt);const n=nodeAt(x,y);if(!n)closePanel();
});
canvas.addEventListener("mouseleave",()=>{hoveredNode=null;});

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    buildView(btn.dataset.view);
  });
});

// ============================================================
// Load external data then boot
(async function() {
  try {
    const resp = await fetch('./ai-research-data.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    DATA = { entities: json.entities, relationships: json.relationships };
    
    // Rebuild indexes
    DATA.entities.forEach(e => { byId[e.id] = e; });
    DATA.relationships.forEach(r => {
      (relsByFrom[r.from] = relsByFrom[r.from]||[]).push(r);
      (relsByTo[r.to]     = relsByTo[r.to]    ||[]).push(r);
    });
    
    // Update header
    const ht = document.querySelector('.header-title');
    if (ht && json.title) ht.textContent = json.title;
    
    resize();
  } catch(err) {
    document.body.innerHTML = '<div style="padding:40px;font-family:Georgia,serif;color:#2a2724;">'
      + '<h2 style="font-weight:400;">Data file not found</h2>'
      + '<p style="color:#8a847c;margin-top:12px;">Place <code>ai-research-data.json</code> next to this HTML file.</p>'
      + '<p style="color:#8a847c;margin-top:8px;">Error: ' + err.message + '</p></div>';
  }
})();
</script>
