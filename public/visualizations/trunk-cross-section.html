<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #2a2520;
  color: #faf8f4;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#app { width: 100%; height: 100%; position: relative; }

/* Top bar */
.top-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  padding: 16px 24px;
  display: flex; align-items: center; gap: 16px;
  background: linear-gradient(180deg, rgba(42,37,32,0.95) 0%, rgba(42,37,32,0) 100%);
}
.top-bar h1 { font: 600 18px Georgia, serif; color: #faf8f4; }
.stats { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: #8a8580; }
.stats .stat-val { color: #faf8f4; font-weight: 600; }

/* Ring labels */
.ring-label {
  position: absolute; z-index: 5;
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(250,248,244,0.15); font-weight: 600;
  pointer-events: none;
}

/* Canvas area */
#ring-canvas {
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
}

/* SVG connections */
#connections-svg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 5; pointer-events: none;
}

/* Element nodes on the rings */
.node {
  position: absolute;
  background: rgba(250,248,244,0.06);
  border: 1px solid rgba(250,248,244,0.12);
  border-radius: 8px;
  padding: 5px 8px;
  cursor: pointer;
  transition: all 0.25s ease;
  max-width: 160px;
  z-index: 10;
  font-size: 9px;
}
.node:hover {
  background: rgba(250,248,244,0.12);
  border-color: rgba(250,248,244,0.3);
  transform: scale(1.08);
  z-index: 20;
}
.node.active {
  background: rgba(250,248,244,0.15);
  border-color: rgba(196,144,48,0.6);
  box-shadow: 0 0 20px rgba(196,144,48,0.15);
  z-index: 25;
}
.node .node-id {
  font-size: 8px; font-weight: 700;
  margin-bottom: 1px;
  opacity: 0.5;
}
.node .node-title {
  font-size: 9px; font-weight: 500;
  line-height: 1.2;
  color: #faf8f4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.node.canopy { border-left: 2px solid #a85050; }
.node.canopy .node-id { color: #c46a6a; }
.node.trunk-ks { border-left: 2px solid #c49030; }
.node.trunk-ks .node-id { color: #d4a843; }
.node.atomic { border-left: 2px solid #6a6560; }
.node.atomic .node-id { color: #8a8580; }

/* Detail panel - DEPTH VIEW */
.detail-panel {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 400px;
  background: rgba(42,37,32,0.97);
  border-left: 1px solid rgba(250,248,244,0.08);
  padding: 60px 20px 20px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  z-index: 50;
}
.detail-panel.open { transform: translateX(0); }
.detail-panel .close-btn {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px;
  border: 1px solid rgba(250,248,244,0.15);
  border-radius: 50%;
  background: none; color: #8a8580;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.detail-panel .close-btn:hover { color: #faf8f4; border-color: rgba(250,248,244,0.3); }

/* Panel header */
.panel-header {
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(250,248,244,0.08);
}
.panel-header .panel-id {
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  margin-bottom: 4px;
}
.panel-header .panel-title {
  font: 600 15px Georgia, serif;
  color: #faf8f4;
  line-height: 1.3;
}
.panel-layer {
  display: inline-block;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 3px;
  margin-top: 6px;
}
.panel-layer.canopy { background: rgba(168,80,80,0.2); color: #c46a6a; }
.panel-layer.trunk-ks { background: rgba(196,144,48,0.2); color: #d4a843; }
.panel-layer.atomic { background: rgba(106,101,96,0.2); color: #8a8580; }

/* Quote */
.panel-quote {
  font-size: 12px; font-style: italic; color: #b4afa7;
  padding: 10px 14px;
  border-left: 2px solid rgba(196,144,48,0.3);
  margin: 12px 0;
  line-height: 1.5;
}

/* Tags */
.panel-tags {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin: 10px 0 16px;
}
.panel-tags .tag {
  font-size: 9px; padding: 2px 6px;
  background: rgba(250,248,244,0.05);
  border-radius: 3px; color: #8a8580;
}

/* Axis labels */
.axis-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(250,248,244,0.35);
  margin: 16px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(250,248,244,0.06);
}
.axis-label .axis-desc {
  font-size: 9px; font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: rgba(250,248,244,0.2);
  display: block;
  margin-top: 2px;
}

/* Depth stack */
.depth-stack {
  display: flex; flex-direction: column; gap: 3px;
}
.depth-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
  border-left: 2px solid transparent;
}
.depth-item:hover {
  background: rgba(250,248,244,0.06);
}
.depth-item.canopy { border-left-color: #a85050; }
.depth-item.trunk-ks { border-left-color: #c49030; }
.depth-item.atomic { border-left-color: #6a6560; }

.depth-item .di-id {
  font-size: 8px; font-weight: 700;
  opacity: 0.5; min-width: 40px;
}
.depth-item .di-title {
  font-size: 10px; color: #b4afa7;
  line-height: 1.3;
}
.depth-item .di-ks {
  font-size: 7px; font-weight: 700;
  letter-spacing: 0.5px;
  color: #c49030; margin-left: auto;
  white-space: nowrap;
}

/* Surface connections (secondary) */
.surface-section { margin-top: 12px; }
.surface-item {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
  font-size: 10px; color: #8a8580;
}
.surface-item:hover {
  background: rgba(250,248,244,0.06);
  color: #b4afa7;
}
.surface-item .si-id {
  font-size: 8px; font-weight: 700;
  opacity: 0.5; min-width: 40px;
}

/* Depth bar visualization */
.depth-bar {
  height: 6px; border-radius: 3px;
  margin: 8px 0 4px;
  background: rgba(250,248,244,0.05);
  overflow: hidden;
}
.depth-bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #6a4530, #c49030, #a85050);
  transition: width 0.5s ease;
}
.depth-bar-label {
  font-size: 9px; color: #6a6560;
  margin-bottom: 12px;
}

/* Empty state */
.empty-depth {
  font-size: 11px; color: #5a5550;
  font-style: italic;
  padding: 12px 0;
}
</style>

const canvas = document.getElementById('ring-canvas');
const ctx = canvas.getContext('2d');
const nodesContainer = document.getElementById('nodes-container');
const svg = document.getElementById('connections-svg');
const panel = document.getElementById('detail-panel');
const panelContent = document.getElementById('panel-content');

let activeElement = null;
let nodePositions = {};
let centerX, centerY, maxRadius;

function init() {
  // Stats
  const total = ELEMENTS.length;
  const ks = ELEMENTS.filter(e => e.keystone).length;
  const canopy = ELEMENTS.filter(e => e.ring === 'canopy').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-ks').textContent = ks;
  document.getElementById('stat-canopy').textContent = canopy;

  resize();
  window.addEventListener('resize', resize);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.scale(dpr, dpr);

  centerX = window.innerWidth / 2 - (panel.classList.contains('open') ? 200 : 0);
  centerY = window.innerHeight / 2;
  maxRadius = Math.min(window.innerWidth * 0.38, window.innerHeight * 0.42);

  drawRings();
  placeNodes();
  if (activeElement) drawConnections(activeElement);
}

function drawRings() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const rings = [
    { r: maxRadius * 0.95, label: 'TRUNK (ATOMIC)', color: 'rgba(250,248,244,0.03)' },
    { r: maxRadius * 0.65, label: 'TRUNK (KEYSTONE)', color: 'rgba(196,144,48,0.04)' },
    { r: maxRadius * 0.35, label: 'CANOPY', color: 'rgba(168,80,80,0.05)' },
  ];

  rings.forEach(ring => {
    ctx.beginPath();
    ctx.arc(centerX, centerY, ring.r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(250,248,244,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Fill zone
    ctx.beginPath();
    ctx.arc(centerX, centerY, ring.r, 0, Math.PI * 2);
    ctx.fillStyle = ring.color;
    ctx.fill();
  });

  // Center dot
  ctx.beginPath();
  ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(168,80,80,0.3)';
  ctx.fill();
}

function placeNodes() {
  nodesContainer.innerHTML = '';
  nodePositions = {};

  const canopyEls = ELEMENTS.filter(e => e.ring === 'canopy');
  const trunkKsEls = ELEMENTS.filter(e => e.ring === 'trunk_keystone');
  const atomicEls = ELEMENTS.filter(e => e.ring === 'trunk_atomic');

  function placeRing(els, radiusMin, radiusMax) {
    const count = els.length;
    if (!count) return;
    // Determine how many rows we need
    const circumference = 2 * Math.PI * ((radiusMin + radiusMax) / 2);
    const nodeWidth = 140;
    const perRow = Math.max(Math.floor(circumference / (nodeWidth + 20)), 8);
    const rows = Math.ceil(count / perRow);

    els.forEach((el, i) => {
      const row = Math.floor(i / perRow);
      const posInRow = i % perRow;
      const rowTotal = Math.min(perRow, count - row * perRow);
      const r = radiusMin + (radiusMax - radiusMin) * ((row + 0.5) / rows);
      const angleStep = (2 * Math.PI) / rowTotal;
      const angleOffset = (row * 0.3); // stagger rows
      const angle = angleStep * posInRow + angleOffset;

      const x = centerX + r * Math.cos(angle);
      const y = centerY + r * Math.sin(angle);

      nodePositions[el.id] = { x, y };

      const node = document.createElement('div');
      const ringClass = el.ring === 'canopy' ? 'canopy' : el.ring === 'trunk_keystone' ? 'trunk-ks' : 'atomic';
      node.className = `node ${ringClass}`;
      if (activeElement && activeElement.id === el.id) node.classList.add('active');
      node.style.left = (x - 65) + 'px';
      node.style.top = (y - 16) + 'px';
      node.innerHTML = `<div class="node-id">${el.id}</div><div class="node-title">${el.title.substring(0, 45)}${el.title.length > 45 ? '...' : ''}</div>`;
      node.addEventListener('click', () => selectElement(el));
      nodesContainer.appendChild(node);
    });
  }

  placeRing(canopyEls, maxRadius * 0.12, maxRadius * 0.33);
  placeRing(trunkKsEls, maxRadius * 0.38, maxRadius * 0.62);
  placeRing(atomicEls, maxRadius * 0.67, maxRadius * 0.93);
}

function selectElement(el) {
  activeElement = el;
  openPanel(el);
  resize(); // Reposition with panel offset
}

function drawConnections(el) {
  svg.innerHTML = '';
  const pos = nodePositions[el.id];
  if (!pos) return;

  // Draw lines to direct connections (surface)
  const allConns = [...(el.connections || []), ...(el.referenced_by || [])];
  allConns.forEach(connId => {
    const connPos = nodePositions[connId];
    if (!connPos) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', pos.x);
    line.setAttribute('y1', pos.y);
    line.setAttribute('x2', connPos.x);
    line.setAttribute('y2', connPos.y);
    line.setAttribute('stroke', 'rgba(196,144,48,0.15)');
    line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
  });
}

function openPanel(el) {
  panel.classList.add('open');
  const ringClass = el.ring === 'canopy' ? 'canopy' : el.ring === 'trunk_keystone' ? 'trunk-ks' : 'atomic';
  const layerLabel = el.ring === 'canopy' ? 'Canopy' : el.ring === 'trunk_keystone' ? 'Trunk Keystone' : 'Trunk Atomic';

  // Get depth chain
  const depthChain = DEPTH_MAP[el.id] || [];
  const maxDepth = Math.max(...Object.values(DEPTH_MAP).map(d => d.length), 1);
  const depthPct = Math.round((depthChain.length / maxDepth) * 100);

  // Surface connections (referenced_by = elements that came AFTER and reference this one)
  const surfaceRefs = (el.referenced_by || []).map(id => {
    const found = ELEMENTS.find(e => e.id === id);
    return found ? found : null;
  }).filter(Boolean);

  let html = `
    <div class="panel-header">
      <div class="panel-id" style="color: ${ringClass === 'canopy' ? '#c46a6a' : ringClass === 'trunk-ks' ? '#d4a843' : '#8a8580'}">${el.id}</div>
      <div class="panel-title">${el.title}</div>
      <span class="panel-layer ${ringClass}">${layerLabel}${el.keystone ? ' / Keystone' : ''}</span>
    </div>`;

  if (el.quote) {
    html += `<div class="panel-quote">${el.quote}</div>`;
  }

  if (el.tags && el.tags.length) {
    html += `<div class="panel-tags">${el.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>`;
  }

  // DEPTH VIEW (primary axis)
  html += `
    <div class="axis-label">
      DEPTH / SUPPORT BENEATH
      <span class="axis-desc">What this fiber is built on. Compression ancestry.</span>
    </div>
    <div class="depth-bar"><div class="depth-bar-fill" style="width: ${depthPct}%"></div></div>
    <div class="depth-bar-label">${depthChain.length} layers of support (${depthPct}% of max depth)</div>`;

  if (depthChain.length > 0) {
    html += '<div class="depth-stack">';
    depthChain.forEach(item => {
      const dc = item.layer === 'canopy' ? 'canopy' : item.keystone ? 'trunk-ks' : 'atomic';
      html += `
        <div class="depth-item ${dc}" onclick="navigateTo('${item.id}')">
          <span class="di-id">${item.id}</span>
          <span class="di-title">${item.title.substring(0, 50)}${item.title.length > 50 ? '...' : ''}</span>
          ${item.keystone ? '<span class="di-ks">KS</span>' : ''}
        </div>`;
    });
    html += '</div>';
  } else {
    html += '<div class="empty-depth">Foundation element. No deeper support chain.</div>';
  }

  // SURFACE VIEW (secondary axis)
  if (surfaceRefs.length > 0) {
    html += `
      <div class="axis-label" style="margin-top: 20px;">
        SURFACE / REFERENCED BY
        <span class="axis-desc">Later elements that build on this fiber tip.</span>
      </div>
      <div class="surface-section">`;
    surfaceRefs.forEach(ref => {
      html += `
        <div class="surface-item" onclick="navigateTo('${ref.id}')">
          <span class="si-id">${ref.id}</span>
          <span>${ref.title.substring(0, 45)}${ref.title.length > 45 ? '...' : ''}</span>
        </div>`;
    });
    html += '</div>';
  }

  panelContent.innerHTML = html;
}

function navigateTo(id) {
  const el = ELEMENTS.find(e => e.id === id);
  if (el) selectElement(el);
}

function closePanel() {
  panel.classList.remove('open');
  activeElement = null;
  resize();
}

init();
</script>
</body>
</html>
