}

}

// ── Flatten ──
function flatten(n, pid, depth) {
  const e = { ...n, parentId:pid, depth, childIds:(n.children||[]).map(c=>c.id), cx:0, cy:0, r:0 };
  delete e.children;
  nodes.push(e); nodeMap[e.id] = e;
  if (n.children) n.children.forEach(c => flatten(c, n.id, depth+1));
}
flatten(TREE, null, 0);

// ── Layout: radial tree ──
function layoutTree() {
  const root = nodeMap['ndd-root'];
  root.cx = 0; root.cy = 0;

  function layoutChildren(parent, startAngle, sweep, radius) {
    const kids = parent.childIds.map(id => nodeMap[id]).filter(Boolean);
    if (kids.length === 0) return;
    const step = sweep / Math.max(kids.length, 1);
    kids.forEach((kid, i) => {
      const angle = startAngle + step * (i + 0.5);
      kid.cx = parent.cx + Math.cos(angle) * radius;
      kid.cy = parent.cy + Math.sin(angle) * radius;
      // Descendants get tighter sweep and smaller step
      const childSweep = Math.min(step * 1.2, Math.PI * 0.8);
      layoutChildren(kid, angle - childSweep/2, childSweep, radius * 0.7);
    });
  }

  layoutChildren(root, -Math.PI/2 - Math.PI * 0.8, Math.PI * 1.6, 280);

  // Compute radii
  nodes.forEach(n => {
    n.r = n.type === 'root' ? 36 : n.type === 'trunk' ? 28 :
          n.type === 'event-horizon' ? 22 : n.type === 'canopy' ? 22 : 20;
  });
}
layoutTree();

// ── Wormholes ──
function getWormholes(node) {
  if (!node.tags) return [];
  const ancestors = new Set(), desc = new Set();
  let p = node;
  while (p) { ancestors.add(p.id); p = p.parentId ? nodeMap[p.parentId] : null; }
  (function addD(id) { desc.add(id); const n=nodeMap[id]; if(n&&n.childIds) n.childIds.forEach(addD); })(node.id);
  const st = new Set(node.tags);
  const results = [];
  nodes.forEach(o => {
    if (o.id===node.id||ancestors.has(o.id)||desc.has(o.id)||!o.tags) return;
    const shared = o.tags.filter(t=>st.has(t));
    if (shared.length) results.push({ node:o, shared, strength:shared.length/Math.max(node.tags.length,o.tags.length) });
  });
  return results.sort((a,b)=>b.strength-a.strength).slice(0,8);
}

// ── Ancestors ──
function getAncestors(id) {
  const path = [];
  let n = nodeMap[id];
  while (n) { path.push(n.id); n = n.parentId ? nodeMap[n.parentId] : null; }
  return new Set(path);
}

// ── Hex helper ──
function hexRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Camera ──

  targetCamX = -x; targetCamY = -y; targetScale = s || targetScale;

  camX += (targetCamX - camX) * 0.12;
  camY += (targetCamY - camY) * 0.12;
  camScale += (targetScale - camScale) * 0.12;
}

// ── Draw ──
function draw() {
  animateCamera();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2 + camX * camScale, H/2 + camY * camScale);
  ctx.scale(camScale, camScale);

  const cur = nodeMap[currentId];
  const ancestors = getAncestors(currentId);
  const childSet = new Set(cur.childIds || []);
  const worms = getWormholes(cur);
  const wormIds = new Set(worms.map(w => w.node.id));

  // Wormhole arcs (behind everything)
  worms.forEach(w => {
    const from = cur, to = w.node;
    ctx.beginPath();
    const mx = (from.cx+to.cx)/2, my = (from.cy+to.cy)/2;
    const dx = to.cx-from.cx, dy = to.cy-from.cy;
    const cpx = mx - dy*0.3, cpy = my + dx*0.3;
    ctx.moveTo(from.cx, from.cy);
    ctx.quadraticCurveTo(cpx, cpy, to.cx, to.cy);
    const isActiveWorm = activeWormholeTag && w.shared.includes(activeWormholeTag);
    ctx.strokeStyle = isActiveWorm ? hexRgba('#c47058', 0.35) : hexRgba('#c47058', 0.08);
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = isActiveWorm ? 2 : 1;
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Tree connections
  nodes.forEach(n => {
    if (!n.parentId) return;
    const p = nodeMap[n.parentId];
    if (!p) return;

    const isAncestorLine = ancestors.has(n.id) && ancestors.has(p.id);
    const isChildLine = (n.parentId === currentId) || (childSet.has(n.id));
    const isRelated = isAncestorLine || isChildLine || n.id === currentId;

    ctx.beginPath();
    ctx.moveTo(p.cx, p.cy);
    const mx = (p.cx+n.cx)/2, my = (p.cy+n.cy)/2;
    ctx.quadraticCurveTo(mx + (n.cy-p.cy)*0.1, my - (n.cx-p.cx)*0.1, n.cx, n.cy);

    if (isAncestorLine) {
      ctx.strokeStyle = hexRgba('#c49030', 0.3);
      ctx.lineWidth = 2.5;
    } else if (isChildLine) {
      ctx.strokeStyle = hexRgba('#5ab4a0', 0.25);
      ctx.lineWidth = 2;
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.025)';
      ctx.lineWidth = 0.8;
    }
    ctx.stroke();
  });

  // Nodes
  nodes.forEach(n => {
    const isCur = n.id === currentId;
    const isAnc = ancestors.has(n.id);
    const isChild = childSet.has(n.id);
    const isWorm = wormIds.has(n.id);
    const isHover = hoverNode && hoverNode.id === n.id;
    const isRelated = isCur || isAnc || isChild || isWorm;
    const color = COLORS[n.type] || COLORS.branch;

    ctx.save();
    if (!isRelated) ctx.globalAlpha = 0.15;

    // Glow for current
    if (isCur) {
      ctx.beginPath();
      ctx.arc(n.cx, n.cy, n.r + 18, 0, Math.PI*2);
      ctx.fillStyle = hexRgba(color, 0.06);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(n.cx, n.cy, n.r + 10, 0, Math.PI*2);
      ctx.strokeStyle = hexRgba(color, 0.25);
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Wormhole ring
    if (isWorm) {
      ctx.beginPath();
      ctx.arc(n.cx, n.cy, n.r + 6, 0, Math.PI*2);
      ctx.strokeStyle = hexRgba('#c47058', 0.3);
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Hover glow
    if (isHover && !isCur) {
      ctx.beginPath();
      ctx.arc(n.cx, n.cy, n.r + 8, 0, Math.PI*2);
      ctx.fillStyle = hexRgba(color, 0.08);
      ctx.fill();
    }

    // Node body
    ctx.beginPath();
    ctx.arc(n.cx, n.cy, n.r, 0, Math.PI*2);
    if (n.type === 'pruned') {
      ctx.fillStyle = hexRgba(color, 0.05);
      ctx.strokeStyle = hexRgba(color, 0.25);
      ctx.setLineDash([3, 3]);
    } else if (n.type === 'event-horizon') {
      ctx.fillStyle = isCur ? hexRgba(color, 0.2) : hexRgba(color, 0.06);
      ctx.strokeStyle = color;
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = isCur ? hexRgba(color, 0.15) : hexRgba(color, 0.04);
      ctx.strokeStyle = isCur ? color : hexRgba(color, 0.35);
      ctx.setLineDash([]);
    }
    ctx.lineWidth = isCur ? 2.5 : isHover ? 1.5 : 1;
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);

    // Growth ring
    if (n.ring) {
      ctx.beginPath();
      ctx.arc(n.cx, n.cy, n.r + 4, 0, Math.PI*2);
      ctx.strokeStyle = hexRgba('#c49030', 0.2);
      ctx.lineWidth = 1.5;
      ctx.setLineDash([2, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Label
    if (isRelated || camScale > 0.6) {
      ctx.fillStyle = isRelated ? '#f0ece6' : 'rgba(240,236,230,0.4)';
      ctx.font = (n.type==='root'||n.type==='trunk') ? '600 12px Segoe UI, system-ui, sans-serif' : '400 11px Segoe UI, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const words = n.name.split(' ');
      let lines = [], line = '';
      words.forEach(w => {
        const t = line ? line+' '+w : w;
        if (ctx.measureText(t).width > 120 && line) { lines.push(line); line = w; }
        else line = t;
      });
      if (line) lines.push(line);
      lines.forEach((l, i) => ctx.fillText(l, n.cx, n.cy + n.r + 6 + i * 13));
    }

    ctx.restore();
  });

  ctx.restore();
  animFrame = requestAnimationFrame(draw);
}

// ── Navigate ──
function goTo(id) {
  currentId = id;
  activeWormholeTag = null;
  const n = nodeMap[id];
  panTo(n.cx, n.cy, 1);
  renderDetail();
  renderBreadcrumb();
  document.getElementById('stat-depth').textContent = n.depth;
  document.getElementById('stat-worms').textContent = getWormholes(n).length;
}

// ── Detail panel ──
function renderDetail() {
  const n = nodeMap[currentId];
  const worms = getWormholes(n);
  let h = '';
  h += `<div class="d-name">${n.name}</div>`;
  h += `<span class="d-type ${n.type}">${n.type} · depth ${n.depth}</span>`;

  h += `<div class="d-section">So you want to:</div>`;
  h += `<div class="d-want">${n.want||''}</div>`;
  h += `<div class="d-section">This relies on:</div>`;
  h += `<div class="d-relies">${n.relies_on||''}</div>`;

  if (n.ring) h += `<div class="d-ring">"${n.ring}"</div>`;

  h += `<div class="d-status">`;
  h += `<div class="d-stat"><b style="margin-right:2px">Eval:</b> <span class="dot ${n.validation||'seed'}"></span> ${n.validation||'seed'}</div>`;
  h += `<div class="d-stat"><b style="margin-right:2px">Health:</b> <span class="dot ${n.health||'none'}"></span> ${n.health||'none'}</div>`;
  h += `</div>`;

  // Tags
  if (n.tags && n.tags.length) {
    h += `<div class="d-section">Tags (click to find wormholes)</div>`;
    h += `<div class="d-tags">`;
    n.tags.forEach(t => {
      const isActive = activeWormholeTag === t;
      h += `<span class="d-tag ${isActive?'active':''}" data-tag="${t}">${t}</span>`;
    });
    h += `</div>`;
  }

  // Parent
  if (n.parentId) {
    const p = nodeMap[n.parentId];
    h += `<div class="d-section">&uarr; Port up</div>`;
    h += `<div class="d-nav"><button class="d-nav-item port" data-id="${p.id}"><span class="d-nav-arrow">&uarr;</span> ${p.name}</button></div>`;
  }

  // Children
  if (n.childIds && n.childIds.length) {
    h += `<div class="d-section">&darr; Drill down (${n.childIds.length})</div>`;
    h += `<div class="d-nav">`;
    n.childIds.forEach(cid => {
      const c = nodeMap[cid];
      if (c) h += `<button class="d-nav-item drill" data-id="${cid}"><span class="d-nav-arrow">&darr;</span> ${c.name}</button>`;
    });
    h += `</div>`;
  }

  // Wormholes
  if (worms.length) {
    h += `<div class="d-section">&harr; Wormholes (${worms.length})</div>`;
    h += `<div class="d-nav">`;
    worms.forEach(w => {
      h += `<button class="d-nav-item wormhole" data-id="${w.node.id}">
        <span class="d-nav-arrow">&harr;</span>
        <div><div>${w.node.name}</div><div class="d-worm-via">via: ${w.shared.join(', ')}</div></div>
      </button>`;
    });
    h += `</div>`;
  }

  const el = document.getElementById('detail');
  el.innerHTML = h;

  // Bind
  el.querySelectorAll('.d-nav-item').forEach(b => b.addEventListener('click', () => goTo(b.dataset.id)));
  el.querySelectorAll('.d-tag').forEach(t => t.addEventListener('click', () => {
    activeWormholeTag = activeWormholeTag === t.dataset.tag ? null : t.dataset.tag;
    renderDetail();
  }));

  // Quote
  const q = document.getElementById('quote');
  q.textContent = n.ring ? `"${n.ring}"` : n.want ? `"${n.want}"` : '"Every direction means something."';
}

// ── Breadcrumb ──
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const path = [];
  let n = nodeMap[currentId];
  while (n) { path.unshift(n); n = n.parentId ? nodeMap[n.parentId] : null; }
  bc.innerHTML = '';
  path.forEach((p, i) => {
    if (i > 0) { const s = document.createElement('span'); s.className='bc-sep'; s.textContent='\u203A'; bc.appendChild(s); }
    const b = document.createElement('button');
    b.className = 'bc-item' + (p.id===currentId?' current':'');
    b.textContent = p.name;
    if (p.id !== currentId) b.addEventListener('click', () => goTo(p.id));
    bc.appendChild(b);
  });
}

// ── Canvas events ──
function setupCanvas() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);

  canvas.addEventListener('pointerdown', e => {
    isDrag = true; dragSX = e.clientX; dragSY = e.clientY;
    dragCX = targetCamX; dragCY = targetCamY;
    canvas.classList.add('grabbing');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    // Hit test for hover
    const mx = (e.offsetX - W/2/dpr)/camScale - camX;
    const my = (e.offsetY - H/2/dpr)/camScale - camY;
    hoverNode = null;
    nodes.forEach(n => {
      const dx = n.cx-mx, dy = n.cy-my;
      if (Math.sqrt(dx*dx+dy*dy) < n.r + 5) hoverNode = n;
    });
    canvas.style.cursor = hoverNode ? 'pointer' : isDrag ? 'grabbing' : 'grab';

    if (!isDrag) return;
    targetCamX = dragCX + (e.clientX - dragSX) / camScale;
    targetCamY = dragCY + (e.clientY - dragSY) / camScale;
  });
  canvas.addEventListener('pointerup', e => {
    const moved = Math.abs(e.clientX-dragSX) + Math.abs(e.clientY-dragSY);
    isDrag = false;
    canvas.classList.remove('grabbing');
    canvas.releasePointerCapture(e.pointerId);
    if (moved < 5 && hoverNode) goTo(hoverNode.id);
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY > 0 ? 0.9 : 1.1;
    targetScale = Math.max(0.25, Math.min(3, targetScale * d));
  }, { passive: false });
}

function resize() {
  const wrap = canvas.parentElement;
  dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth * dpr; H = wrap.clientHeight * dpr;
  canvas.width = W; canvas.height = H;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  const n = nodeMap[currentId];
  if (e.key === 'ArrowUp' && n.parentId) goTo(n.parentId);
  else if (e.key === 'ArrowDown' && n.childIds && n.childIds.length) goTo(n.childIds[0]);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const w = getWormholes(n);
    if (w.length) goTo(w[e.key==='ArrowLeft'?0:Math.min(1,w.length-1)].node.id);
  }
});

// ── Init ──
document.getElementById('stat-nodes').textContent = nodes.length;
setupCanvas();
goTo('ndd-root');
draw();
</script>
</body>
