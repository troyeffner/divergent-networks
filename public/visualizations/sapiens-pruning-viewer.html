<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Earth — What the Tree Pruned</title>
<meta name="wow-version" content="v3.70.0-troyos" />
<meta name="trunk-stamp" content="v51_20260310" />
<meta name="ndd-ref" content="RE-028" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #1a1612;
  color: #faf8f4;
  min-height: 100vh;
}

.app { display: flex; flex-direction: column; min-height: 100vh; }

.header {
  padding: 20px 32px;
  background: #1e1a16;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header h1 {
  font: 300 22px/1 Georgia, serif;
  color: #b4503c;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.header-sub {
  font: italic 14px/1.4 Georgia, serif;
  color: #8a7e70;
}
.header-stats {
  margin-top: 8px;
  display: flex; gap: 20px;
  font-size: 11px; color: #6a6560;
}
.header-stats .val { color: #b4503c; font-weight: 600; }

.tagline {
  padding: 16px 32px;
  background: rgba(180,80,60,0.06);
  border-bottom: 1px solid rgba(180,80,60,0.1);
  text-align: center;
}
.tagline-text {
  font: italic 16px/1.4 Georgia, serif;
  color: #c8c2b8;
}

/* Filter row */
.filters {
  padding: 12px 32px;
  display: flex; gap: 8px; flex-wrap: wrap;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.era-btn {
  font: 500 10px/1 'Segoe UI', system-ui, sans-serif;
  padding: 5px 10px;
  border-radius: 3px;
  border: 1px solid rgba(180,80,60,0.2);
  background: transparent;
  color: #8a8580;
  cursor: pointer;
  transition: all 0.15s;
}
.era-btn:hover { border-color: rgba(180,80,60,0.4); color: #c8c2b8; }
.era-btn.active { background: rgba(180,80,60,0.15); border-color: #b4503c; color: #b4503c; }

/* Grid of pruned items */
.earth-grid {
  padding: 24px 32px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  flex: 1;
}

.prune-card {
  background: #201c18;
  border: 1px solid rgba(180,80,60,0.12);
  border-radius: 8px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.prune-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #b4503c, rgba(180,80,60,0));
  opacity: 0.4;
}
.prune-card:hover {
  border-color: rgba(180,80,60,0.3);
  background: #252018;
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.prune-card.expanded {
  border-color: rgba(180,80,60,0.4);
  grid-column: 1 / -1;
}

.prune-name {
  font: 600 15px/1.2 Georgia, serif;
  color: #b4503c;
  margin-bottom: 4px;
  text-decoration: line-through;
  text-decoration-color: rgba(180,80,60,0.3);
}
.prune-era {
  font: 400 10px/1 'Segoe UI', system-ui, sans-serif;
  color: #6a6560;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.prune-label {
  font: 400 13px/1.5 'Segoe UI', system-ui, sans-serif;
  color: #a09888;
  margin-bottom: 12px;
}

.prune-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.04);
}
.prune-section-title {
  font: 600 8px/1 'Segoe UI', system-ui, sans-serif;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.prune-section-title.why { color: #b4503c; }
.prune-section-title.soil { color: #5ab4a0; }
.prune-reason {
  font: 400 12px/1.5 'Segoe UI', system-ui, sans-serif;
  color: #b4503c;
  opacity: 0.8;
}
.prune-soil {
  font: italic 13px/1.5 Georgia, serif;
  color: #5ab4a0;
}

.prune-state {
  display: inline-block;
  font: 700 8px/1 'Segoe UI', system-ui, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 6px;
  border-radius: 2px;
  margin-top: 10px;
}
.state-deferred { background: rgba(196,144,48,0.12); color: #c49030; }
.state-incompatible { background: rgba(180,80,60,0.12); color: #b4503c; }

.prune-tags {
  display: flex; gap: 4px; flex-wrap: wrap;
  margin-top: 8px;
}
.prune-tag {
  font: 700 7px/1 'Segoe UI', system-ui, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 2px 5px;
  border-radius: 2px;
  background: rgba(90,180,160,0.1);
  color: #5ab4a0;
}

/* Expanded detail */
.prune-detail {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.prune-card.expanded .prune-detail { display: block; }

.soil-visual {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  padding: 12px;
  background: rgba(90,180,160,0.04);
  border-radius: 6px;
  border: 1px solid rgba(90,180,160,0.1);
}
.soil-icon {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(90,180,160,0.1);
  border: 1px solid rgba(90,180,160,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.soil-text {
  font: 400 12px/1.5 'Segoe UI', system-ui, sans-serif;
  color: #5ab4a0;
}

/* Connection line to living branch */
.connection {
  margin-top: 12px;
  padding: 8px 12px;
  background: rgba(196,144,48,0.04);
  border-radius: 4px;
  border-left: 2px solid rgba(196,144,48,0.3);
}
.connection-label {
  font: 600 8px/1 'Segoe UI', system-ui, sans-serif;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #c49030;
  margin-bottom: 4px;
}
.connection-text {
  font: 400 11px/1.4 'Segoe UI', system-ui, sans-serif;
  color: #a09888;
}

/* Timeline strip */
.timeline {
  padding: 16px 32px;
  background: #1e1a16;
  border-top: 1px solid rgba(255,255,255,0.06);
  overflow-x: auto;
}
.timeline-track {
  position: relative;
  height: 60px;
  min-width: 100%;
}
.timeline-line {
  position: absolute;
  top: 30px; left: 0; right: 0;
  height: 2px;
  background: rgba(180,80,60,0.2);
}
.timeline-dot {
  position: absolute;
  top: 22px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #b4503c;
  border: 2px solid #1e1a16;
  cursor: pointer;
  transition: all 0.15s;
  z-index: 2;
}
.timeline-dot:hover { transform: scale(1.4); }
.timeline-dot-label {
  position: absolute;
  top: 42px;
  font: 400 8px/1.2 'Segoe UI', system-ui, sans-serif;
  color: #6a6560;
  white-space: nowrap;
  transform: translateX(-50%);
  left: 50%;
}

.footer {
  padding: 12px 32px;
  background: #1e1a16;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; justify-content: space-between; align-items: center;
}
.footer-left {
  font: 400 11px/1 'Segoe UI', system-ui, sans-serif;
  color: #6a6560;
}
.footer-right a {
  font: 400 11px/1 'Segoe UI', system-ui, sans-serif;
  color: #c49030;
  text-decoration: none;
}
.footer-right a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>INFRASTRUCTURE EARTH</h1>
    <div class="header-sub">What the tree pruned — and what it left in the soil</div>
    <div class="header-stats">
      <span>Pruned branches: <span class="val" id="prune-count">0</span></span>
      <span>Deferred: <span class="val" id="deferred-count">0</span></span>
      <span>Soil contributions: <span class="val" id="soil-count">0</span></span>
      <span>Time span: <span class="val">2.5M years</span></span>
    </div>
  </div>

  <div class="tagline">
    <div class="tagline-text">"The tree remembers what linear history forgot."</div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="earth-grid" id="earth-grid"></div>

  <div class="timeline">
    <div class="timeline-track" id="timeline-track">
      <div class="timeline-line"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">Sapiens as Fractal Tree — Infrastructure Earth View</div>
    <div class="footer-right">
      <a href="sapiens-temporal-tree.html">View Full Tree &rarr;</a>
    </div>
  </div>
</div>

<script>
let treeData = null;
let prunedNodes = [];
let activeEra = 'all';

// Flatten and collect pruned nodes
function collectPruned(node, parentName) {
  if (node.type === 'pruned') {
    prunedNodes.push({ ...node, parentBranch: parentName });
  }
  if (node.children) {
    node.children.forEach(child => collectPruned(child, node.name));
  }
}

function getEra(dateRange) {
  if (!dateRange) return 'unknown';
  const start = dateRange[0];
  if (start < -70000) return 'pre-cognitive';
  if (start < -12000) return 'cognitive';
  if (start < -5000) return 'agricultural';
  if (start < 1500) return 'unification';
  if (start < 1800) return 'scientific';
  if (start < 1945) return 'industrial';
  return 'information';
}

function getEraLabel(era) {
  const labels = {
    'pre-cognitive': 'Before the Spark',
    'cognitive': 'Cognitive Revolution',
    'agricultural': 'Agricultural Revolution',
    'unification': 'Unification of Humankind',
    'scientific': 'Scientific Revolution',
    'industrial': 'Industrial Revolution',
    'information': 'Information Age'
  };
  return labels[era] || era;
}

function formatDate(d) {
  if (d === null) return 'future';
  if (d < 0) {
    const abs = Math.abs(d);
    if (abs >= 1000000) return (abs / 1000000).toFixed(1) + 'M ya';
    if (abs >= 1000) return Math.round(abs / 1000) + 'k ya';
    return abs + ' BCE';
  }
  return d + ' CE';
}

function dateRange(dr) {
  if (!dr) return '';
  return formatDate(dr[0]) + ' → ' + formatDate(dr[1]);
}

// Living connections map — what the pruned branch connects to in the living tree
const connections = {
  'neanderthals': { to: 'Modern Humans', text: '1-4% of non-African DNA. Your immune system carries Neanderthal innovations. The pruned branch lives inside you.' },
  'homo-erectus': { to: 'Human Endurance', text: 'Nearly 2 million years of success. Modern humans have existed for 300,000. Erectus lasted 6x longer.' },
  'denisovans': { to: 'Tibetan Plateau', text: 'The EPAS1 gene allowing Tibetans to thrive at high altitude came from a ghost species we barely know existed.' },
  'homo-floresiensis': { to: 'Island Ecosystems', text: 'Proof that evolution is not a ladder toward bigness. Smaller was better on Flores. The tree grows in every direction.' },
  'forager-cultures': { to: 'Modern Wellness Movement', text: 'Paleo diets, intermittent fasting, barefoot running — all reaching back to forager wisdom the tree pruned 12,000 years ago.' },
  'megafauna-extinction': { to: 'Climate Awareness', text: 'The first time humans broke an ecosystem. We are still the same species that hunted mammoths to zero.' },
  'nomadic-pastoralists': { to: 'Digital Nomadism', text: 'The idea that you don\'t need a fixed location to thrive. Pruned by agriculture, re-emerging in the information age.' },
  'barter-myth': { to: 'Cryptocurrency', text: 'The myth that money replaced barter persists. New currencies keep reinventing origin stories. Fiction all the way down.' },
  'failed-empires': { to: 'Modern Infrastructure', text: 'You drive on Roman roads (paved over). You speak Latin (evolved into Romance languages). You use Roman law (adapted into constitutions).' },
  'dead-religions': { to: 'Modern Holidays', text: 'Christmas trees (pagan). Easter eggs (fertility rites). Halloween (Samhain). The dead gods still set your calendar.' },
  'dead-languages': { to: 'Modern Vocabulary', text: 'English: 29% Latin, 29% French, 26% Germanic, rest from everywhere. Every word is soil from a dead tongue.' },
  'alchemy-astrology': { to: 'Modern Chemistry', text: 'Newton spent more time on alchemy than physics. The periodic table grew from alchemical classification. The method survived the beliefs.' },
  'indigenous-cultures-pruned': { to: 'Ethnobotany & Land Management', text: 'Aboriginal fire management, Amazonian terra preta, indigenous seed banks. Millennia of ecological knowledge, mostly unexamined.' }
};

function renderFilters() {
  const eras = new Set(prunedNodes.map(n => getEra(n.date_range)));
  const container = document.getElementById('filters');

  let html = '<button class="era-btn active" data-era="all">All Pruned</button>';
  [...eras].sort((a, b) => {
    const order = ['pre-cognitive', 'cognitive', 'agricultural', 'unification', 'scientific', 'industrial', 'information'];
    return order.indexOf(a) - order.indexOf(b);
  }).forEach(era => {
    html += `<button class="era-btn" data-era="${era}">${getEraLabel(era)}</button>`;
  });

  container.innerHTML = html;
  container.querySelectorAll('.era-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeEra = btn.dataset.era;
      renderCards();
    });
  });
}

function renderCards() {
  const grid = document.getElementById('earth-grid');
  const filtered = activeEra === 'all' ? prunedNodes :
    prunedNodes.filter(n => getEra(n.date_range) === activeEra);

  // Sort by date (oldest first)
  filtered.sort((a, b) => (a.date_range?.[0] || 0) - (b.date_range?.[0] || 0));

  grid.innerHTML = filtered.map(node => {
    const era = getEra(node.date_range);
    const state = node.id === 'barter-myth' ? 'incompatible' : 'deferred';
    const conn = connections[node.id];

    return `
      <div class="prune-card" data-id="${node.id}" onclick="toggleCard(this)">
        <div class="prune-name">${node.name}</div>
        <div class="prune-era">${getEraLabel(era)} · ${dateRange(node.date_range)}</div>
        <div class="prune-label">${node.label}</div>

        <div class="prune-section">
          <div class="prune-section-title why">Why it was pruned</div>
          <div class="prune-reason">${node.prune_reason || 'Unknown'}</div>
        </div>

        <div class="prune-section">
          <div class="prune-section-title soil">What it left in the soil</div>
          <div class="prune-soil">${node.soil_contribution || 'Unknown'}</div>
        </div>

        <div class="prune-tags">
          <span class="prune-state state-${state}">${state === 'incompatible' ? 'incompatible-static' : 'deferred — re-sparkable'}</span>
        </div>
        <div class="prune-tags">
          ${(node.tags || []).filter(t => t !== 'pruned').map(t => `<span class="prune-tag">${t}</span>`).join('')}
        </div>

        <div class="prune-detail">
          ${conn ? `
            <div class="connection">
              <div class="connection-label">Still alive in → ${conn.to}</div>
              <div class="connection-text">${conn.text}</div>
            </div>
          ` : ''}
          <div class="soil-visual">
            <div class="soil-icon">&#x1f331;</div>
            <div class="soil-text">This branch was pruned but its soil feeds the living tree. In the Fractal Method, nothing is deleted — only composted. Every prune carries forward.</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleCard(card) {
  const wasExpanded = card.classList.contains('expanded');
  document.querySelectorAll('.prune-card').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) {
    card.classList.add('expanded');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function renderTimeline() {
  const track = document.getElementById('timeline-track');
  // Use log scale for timeline (spans millions of years)
  const minDate = -2500000;
  const maxDate = 2025;
  const range = maxDate - minDate;

  // Position pruned nodes on timeline
  prunedNodes.forEach(node => {
    if (!node.date_range) return;
    const start = node.date_range[0];
    // Log-ish scale: compress deep past, expand recent
    const normalized = (start - minDate) / range;
    const position = Math.pow(normalized, 0.3) * 100; // power curve to spread recent events

    const dot = document.createElement('div');
    dot.className = 'timeline-dot';
    dot.style.left = position + '%';
    dot.title = node.name + ' (' + formatDate(start) + ')';
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      const card = document.querySelector(`.prune-card[data-id="${node.id}"]`);
      if (card) {
        document.querySelectorAll('.prune-card').forEach(c => c.classList.remove('expanded'));
        card.classList.add('expanded');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    const label = document.createElement('div');
    label.className = 'timeline-dot-label';
    label.textContent = node.name.length > 15 ? node.name.substring(0, 13) + '...' : node.name;

    dot.appendChild(label);
    track.appendChild(dot);
  });
}

async function init() {
  const resp = await fetch('sapiens-tree-data.json');
  treeData = await resp.json();

  collectPruned(treeData.tree, 'Root');

  // Stats
  document.getElementById('prune-count').textContent = prunedNodes.length;
  document.getElementById('deferred-count').textContent = prunedNodes.filter(n => n.id !== 'barter-myth').length;
  document.getElementById('soil-count').textContent = prunedNodes.filter(n => n.soil_contribution).length;

  renderFilters();
  renderCards();
  renderTimeline();
}

init();
</script>
</body>
</html>
